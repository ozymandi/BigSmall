# Default configuration. Override with ~/.lmagent/config.yaml, ./lmagent.yaml, or LMAGENT_CONFIG=<path>.

server:
  base_url: http://localhost:1234
  timeout: 900            # seconds per request
  retries: 2              # retries on timeouts, connection errors, 5xx and unloaded-model errors
  retry_delay: 2          # seconds, doubled on each retry
  api_key: ""             # LM Studio API token when "Require Authentication" is on; env LMSTUDIO_API_KEY overrides

models:
  code: qwen/qwen3.8-27b               # code, logic, structured extraction
  text: qwen/qwen3.8-27b               # prose, translation; Gemma 4 31B translated slightly better but 3x slower plus a model switch (measured 2026-10-07)
  bulk: qwen/qwen3.8-27b               # mass processing; Nemotron (26 GB, 32k ctx) did not pay off on a 32 GB GPU
  embed: text-embedding-nomic-embed-text-v1.5

load:
  policy: smart           # prefer_loaded: reuse whatever LLM is in VRAM; smart: switch to the role model only for big inputs; strict: always load the role model
  switch_min_tokens: 40000  # smart policy: switch models only when the input is at least this many tokens
  context_length: 89344  # Qwen 27B fits this on 32 GB VRAM; the planner reads the real loaded context anyway
  ttl: 1800               # unload after N seconds idle
  parallel: 4
  unload_others: true     # only one big model fits in VRAM: unload other LLMs before loading

generation:
  temperature: 0.2
  max_tokens: 8192        # cap on output per call
  reserve_tokens: 2048    # minimum output room reserved per concurrent worker when planning chunks
  thinking: false         # disable chain-of-thought for Qwen-style models

chunking:
  chunk_tokens: 10000
  overlap_tokens: 150
  token_safety: 1.5       # model tokenizers count more than tiktoken (measured: 1.45 on logs, 1.1 on code); context budget is divided by this
  max_parallel: 4         # concurrent requests; the loaded context is shared between them, so the runner lowers this when chunks would not fit
  min_chunk_tokens: 6000  # prefer fewer workers over chunks smaller than this
  max_file_bytes: 5000000

index:
  dir: .lmagent/index     # relative to the indexed root
  chunk_tokens: 400       # nomic embed context is 2048 tokens
  overlap_tokens: 40
  batch: 32               # texts per embeddings request
  exclude: ["*.lock", "*.min.js", "*.min.css", "*.map", "*.svg", "*.ipynb", "package-lock.json", "yarn.lock"]
                          # file-name globs; "dir/" skips that directory anywhere (vendored forks), "vendor/*" a path
  answer_k: 12            # hits handed to the model for `search --ask` / lm_search(ask=...), capped by the context budget

output:
  dir: .lmagent/out       # relative to the working directory
  backup_dir: .lmagent/backup  # rewrite --in-place keeps the originals here, one folder per run
  inline_limit: 6000      # chars returned inline to the caller; longer results also go to a file
  log: ~/.lmagent/log.jsonl
